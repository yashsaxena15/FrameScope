name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framescope:
    name: FrameScope
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FPS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + build
        env:
          FPS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FPS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FPS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --stacktrace :fpscore:test :framescope:assembleRelease :framescope:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp framescope/build/outputs/apk/release/*.apk "out/FrameScope-${VERSION_NAME}.apk"
          cp framescope/build/outputs/apk/debug/*.apk "out/FrameScope-${VERSION_NAME}-debug.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: framescope-apk
          path: out/*.apk

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpscore-test-report
          path: fpscore/build/reports/tests/

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/FrameScope-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true

  perfmonpro:
    # The original Redmi Note 9 app. Not yet migrated; build is informational only.
    name: PerformanceMonitorPro (legacy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --stacktrace :app:assembleDebug
